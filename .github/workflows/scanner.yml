name: Daily NSE Pattern Scanner

on:
  schedule:
    # 4:30 PM IST = 11:00 AM UTC
    - cron: "40 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scanner
        run: |
          python scanner.py

      - name: Write last updated timestamp
        run: echo "$(TZ='Asia/Kolkata' date '+%d %b %Y, %I:%M %p IST')" > last_updated.txt

      - name: Commit latest output
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add output/latest_output.csv
          git add output/future_output.csv
          git add output/vcp_output.csv
          git add last_updated.txt
          git commit -m "Daily scan result $(date -u)" || echo "No changes"
          git push
